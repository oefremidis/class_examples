services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma-db
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-db
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI: http://localhost:7474
      - "7687:7687"   # Bolt: what Python connects to
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'   # LangChain uses APOC to read the graph schema
    volumes:
      - neo4j_data:/data

volumes:
  chroma_data:
  neo4j_data:
